# CI + 出包发布：
# - PR / 手动触发：只跑静态检查和单测
# - push 到 main：检查通过后构建签名 APK，发布为 GitHub Release（tag = b<运行号>）
#   App 端（设置页"应用更新"）据此检查并原地覆盖升级。
# 签名密钥存 GitHub 机密（KEYSTORE_BASE64 等），与手机上已装版本的签名一致，
# 因此 CI 出的包可直接覆盖安装，训练数据不丢。
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:          # 纯文档 / CI 配置改动不出空版本包（App 端会误报更新红点）
      - '**.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # 测试规范检查：禁止「固定睡一段 → 直接断言」（CI 偶发失败的根因）
      - run: dart tool/check_test_sleeps.dart
      - run: flutter test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes 需要最近提交记录
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: 还原签名（无 key.properties 时 gradle 自动回退调试签名）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: 构建 APK（构建号 = CI 运行号，App 内据此判断是否更新）
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          TAG="b${{ github.run_number }}"
          # 只列"自上一个版本以来"的提交，不把早已发过的功能重复列进说明
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ] && [ "$(git rev-list --count "$PREV..HEAD")" -gt 0 ]; then
            RANGE="$PREV..HEAD"
          else
            RANGE="-8"   # 兜底：拿不到上个版本时退回最近 8 条
          fi
          {
            echo "> [!NOTE]"
            echo "> 与手机上已装版本签名一致，直接覆盖安装不丢训练数据；也可在 App 内「设置 → 应用更新」一键升级。"
            echo "> Same signing key as installed builds — overwrite-installing keeps all training data. In-app update: Settings → App Update."
            echo
            echo "## 📦 下载 Download"
            echo "- **Android APK**（Android 8.0+）：见下方 Assets 里的 \`baoji-timer-${TAG}.apk\` / see \`baoji-timer-${TAG}.apk\` in Assets below"
            echo
            echo "## ✨ 本次更新 What's New"
            # 用户视角：只留每个提交的主句（分号前），去掉 merge 噪音 / hash / [ZCode] 前缀 / PR 号
            # （提交主语为中文；版本重点的双语说明由维护者在 Release 页补充）
            git log --no-merges --pretty=format:'%s' $RANGE \
              | sed -E 's/^\[ZCode\] +//' \
              | sed -E 's/ +\(#[0-9]+\)$//' \
              | sed -E 's/[;；].*//' \
              | sed 's/^/- /'
            echo
            echo "## ℹ️ 关于 About"
            echo "- 🔒 无服务器 · 数据 100% 本地 · 无广告无统计 — No server, 100% local data, no ads, no analytics"
            echo "- 🌐 App 内置中英双语（设置 → 语言）— In-app Chinese/English (Settings → Language)"
            echo "- 📖 [中文 README](https://github.com/kelinpan0524-cell/baoji-timer#readme) · [English README](https://github.com/kelinpan0524-cell/baoji-timer/blob/main/README_EN.md)"
            echo "- 🐛 反馈问题 / Issues: https://github.com/kelinpan0524-cell/baoji-timer/issues"
          } > notes.md
          gh release create "$TAG" \
            --title "v${VERSION} (build ${{ github.run_number }})" \
            --notes-file notes.md \
            "build/app/outputs/flutter-apk/app-release.apk#baoji-timer-${TAG}.apk"
